[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cage"
version = "0.1.0"
description = "CAGE: context-aware, goal-directed agentic computation graph optimization (Codex harness)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cage = "cage.cli:main"

[tool.setuptools.packages.find]
include = ["cage*"]

[tool.setuptools.package-data]
cage = ["hw/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
